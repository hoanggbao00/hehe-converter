name: MediaDrop
options:
  bundleIdPrefix: com.hoanggbao
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
    INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MediaDrop:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoanggbao.MediaDrop
        PRODUCT_NAME: MediaDrop
    dependencies: []
  MediaDropTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: MediaDrop
